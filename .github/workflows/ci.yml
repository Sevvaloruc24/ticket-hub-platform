name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            services/ticket-service/package.json
            services/mock-external-service/package.json
            web/package.json

      - name: Validate Mock Service
        run: |
          cd services/mock-external-service
          npm ci

      - name: Validate Ticket Service
        run: |
          cd services/ticket-service
          npm ci

      - name: Build Web Client
        run: |
          cd web
          npm ci
          npm run build

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker-setup-buildx-action@v3

      - name: Build Mock Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/mock-external-service
          push: false
          tags: ticket-mock-external:latest

      - name: Build Ticket Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ticket-service
          push: false
          tags: ticket-service:latest

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          tags: ticket-web:latest
