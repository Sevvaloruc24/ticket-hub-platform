apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-hub-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sevvaloruc24/ticket-hub-platform.git'
    targetRevision: main
    path: infra/helm/ticket-hub
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
