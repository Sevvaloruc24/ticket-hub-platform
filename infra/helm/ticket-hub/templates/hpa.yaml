{{- if .Values.ticketService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticket-service-hpa
  labels:
    {{- include "ticket-hub.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticket-service-deployment
  minReplicas: {{ .Values.ticketService.hpa.minReplicas }}
  maxReplicas: {{ .Values.ticketService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ticketService.hpa.targetCPUUtilizationPercentage }}
{{- end }}
